<div class="overflow-x-auto max-h-[500px] relative border-t border-white/5 scrollbar-thin scrollbar-thumb-white/10 scrollbar-track-transparent">
  @if (hasData) {
    @let rows = dataAsArray;
    @let firstRow = rows[0];

    <table class="min-w-full text-sm whitespace-nowrap">
      <thead class="sticky top-0 z-10">
      <tr>
        <th scope="col" class="w-12 px-6 py-4 text-center text-xs font-medium text-blue-300/70 uppercase tracking-widest border-b border-r border-white/5 bg-slate-900/90 backdrop-blur-sm shadow-[0_1px_0_rgba(255,255,255,0.05)]">#</th>
        @for (item of firstRow | keyvalue; track item.key) {
          <th scope="col" class="px-6 py-4 text-left text-xs font-medium text-blue-200/70 uppercase tracking-widest border-b border-white/5 bg-slate-900/90 backdrop-blur-sm shadow-[0_1px_0_rgba(255,255,255,0.05)]">{{ item.key }}</th>
        }
      </tr>
      </thead>
      <tbody class="divide-y divide-white/5">
        @for (row of rows; track $index) {
          <tr class="hover:bg-blue-900/10 transition-colors duration-200 group cursor-default">
            <td class="w-12 px-6 py-3 text-center text-blue-300/30 font-medium border-r border-white/5 group-hover:text-blue-300/60 transition-colors duration-200">{{ $index + 1 }}</td>
            @for (cell of row | keyvalue; track cell.key) {
              <td class="px-6 py-3 text-slate-400 truncate max-w-xs group-hover:text-slate-200 transition-colors duration-200" [title]="cell.value">{{ cell.value }}</td>
            }
          </tr>
        }
      </tbody>
    </table>
  } @else {
    <div class="py-12 px-4 text-center text-blue-300/40 italic flex flex-col items-center">
       <svg class="h-8 w-8 text-blue-400/20 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
         <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
       </svg>
       <span class="font-light tracking-wide text-sm">No data available.</span>
    </div>
  }
</div>
