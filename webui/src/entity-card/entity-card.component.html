<section class="entity-card group">
  <header class="entity-card__header">
    <h2 class="entity-card__title">{{ entity.name }}</h2>
    <span class="entity-card__badge">{{ recordCount }} records</span>
  </header>

  <details class="entity-card__metadata-details group">
    <summary class="entity-card__metadata-summary">
       <svg class="entity-card__metadata-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
         <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
       </svg>
       View Metadata
    </summary>
    <div class="entity-card__metadata-content">
      <pre class="entity-card__metadata-json">{{ entity.metadata | json }}</pre>
    </div>
  </details>

  <div class="entity-card__table-container">
    <app-dynamic-table [entityName]="entity.name" [data]="entity.data" [metadata]="entity.metadata" />
  </div>
</section>
