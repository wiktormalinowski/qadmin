<section class="bg-slate-900/40 backdrop-blur-sm border border-blue-500/20 rounded-2xl mb-8 shadow-lg hover:border-blue-500/40 hover:bg-slate-900/60 transition-all duration-300 overflow-hidden group">
  <header class="py-5 px-6 border-b border-white/5 flex justify-between items-center bg-transparent transition-colors duration-300">
    <h2 class="m-0 text-xl font-semibold text-slate-200 capitalize tracking-wide">{{ entity.name }}</h2>
    <span class="bg-blue-500/10 text-blue-300 px-3 py-1 rounded-full text-xs font-medium tracking-wide border border-blue-400/20">{{ recordCount }} records</span>
  </header>

  <details class="bg-transparent border-b border-white/5 text-sm transition-all duration-300">
    <summary class="py-3 px-6 cursor-pointer text-blue-200/60 font-medium select-none hover:text-blue-200 hover:bg-white/5 transition-all duration-300 flex items-center outline-none">
       <svg class="w-4 h-4 mr-3 transition-transform duration-300 group-open:rotate-90 text-blue-400/50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
         <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
       </svg>
       View Metadata
    </summary>
    <div class="p-0 border-t border-white/5 bg-slate-950/50 backdrop-blur-md">
      <pre class="m-0 p-5 text-blue-100/70 overflow-x-auto text-xs font-mono rounded-none leading-relaxed">{{ entity.metadata | json }}</pre>
    </div>
  </details>

  <div class="p-0 bg-transparent">
    <app-dynamic-table [entityName]="entity.name" [data]="entity.data" [metadata]="entity.metadata" />
  </div>
</section>
