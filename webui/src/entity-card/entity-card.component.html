<section class="bg-white border border-slate-200 rounded-xl mb-8 shadow-sm hover:shadow-md transition-shadow duration-200 overflow-hidden">
  <header class="py-4 px-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
    <h2 class="m-0 text-xl font-bold text-slate-800 capitalize">{{ entity.name }}</h2>
    <span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-semibold tracking-wide border border-indigo-100 shadow-sm">{{ recordCount }} records</span>
  </header>

  <details class="group bg-slate-50 border-b border-slate-100 text-sm">
    <summary class="py-3 px-6 cursor-pointer text-slate-600 font-medium select-none hover:text-slate-900 hover:bg-slate-100 transition-colors duration-150 flex items-center">
       <svg class="w-4 h-4 mr-2 transition-transform duration-200 group-open:rotate-90 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
         <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
       </svg>
       View Metadata
    </summary>
    <div class="p-0 border-t border-slate-100">
      <pre class="m-0 p-4 bg-slate-900 text-slate-200 overflow-x-auto text-xs font-mono rounded-b-none">{{ entity.metadata | json }}</pre>
    </div>
  </details>

  <div class="p-0">
    <app-dynamic-table [data]="entity.data" />
  </div>
</section>
