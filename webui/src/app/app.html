<div class="app">

  <div class="app__blob app__blob--blue"></div>
  <div class="app__blob app__blob--sky"></div>

  <div class="app__main-card">

    <header class="app__header">
      <h1 class="app__title">QAdmin AI</h1>
      <p class="app__subtitle">Your intelligent entity manager. CRUD reimagined 😉</p>
    </header>

    <div class="search-bar group">
      <div class="search-bar__glow"></div>
      <div class="search-bar__box">
        <input
          #promptInput
          type="text"
          placeholder="Ask me for data (e.g., 'show all users')..."
          class="search-bar__input"
          (input)="null"
          (keydown.enter)="promptInput.value.trim() && (entityFromPrompt$ = service.getEntityFromPrompt(promptInput.value))"
        />
        <button
          (click)="entityFromPrompt$ = service.getEntityFromPrompt(promptInput.value)"
          [disabled]="!promptInput.value.trim()"
          class="search-bar__button"
        >
          Start searching
        </button>
      </div>
    </div>

    <!-- Expanding container -->
    <div class="results"
         [class.results--expanded]="entityFromPrompt$"
         [class.results--collapsed]="!entityFromPrompt$">
      <div class="overflow-hidden">
        <div class="results__wrapper">
          @if (entityFromPrompt$; as entityObs) {
            @let entity = entityObs | async;
            <div class="relative grid">
               <!-- Skeleton Layer (fades out smoothly) -->
               <div class="col-start-1 row-start-1 transition-opacity duration-1000 ease-in-out"
                    [class.opacity-0]="entity"
                    [class.pointer-events-none]="entity">
                 
                 <div class="skeleton-card relative">
                   <!-- Loading Overlay -->
                   @if (!entity) {
                     <div class="absolute inset-0 flex items-center justify-center z-20">
                       <div class="flex flex-col items-center bg-slate-900/60 backdrop-blur-md px-10 py-8 rounded-3xl border border-blue-500/10 shadow-2xl">
                         <svg class="animate-spin h-10 w-10 text-blue-400 mb-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                           <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                           <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                         </svg>
                         <div class="loading-message">
                            <span class="loading-message__primary">Thinking...</span>
                            <span class="loading-message__secondary">We still need a few seconds...</span>
                         </div>
                       </div>
                     </div>
                   }

                   <div class="opacity-30">
                     <header class="skeleton-card__header">
                       <div class="skeleton-card__title"></div>
                       <div class="skeleton-card__badge"></div>
                     </header>
                     <div class="skeleton-card__table-container">
                       <table class="skeleton-table">
                         <thead class="skeleton-table__head">
                           <tr>
                             <th class="skeleton-table__th w-12"><div class="skeleton-box w-full bg-slate-700/50"></div></th>
                             <th class="skeleton-table__th w-1/3"><div class="skeleton-box w-full bg-slate-700/50"></div></th>
                             <th class="skeleton-table__th w-1/4"><div class="skeleton-box w-full bg-slate-700/50"></div></th>
                             <th class="skeleton-table__th w-16"><div class="skeleton-box w-full bg-slate-700/50"></div></th>
                           </tr>
                         </thead>
                         <tbody class="skeleton-table__body">
                           <tr class="skeleton-table__row">
                             <td class="skeleton-table__td"><div class="skeleton-box w-6 mx-auto"></div></td>
                             <td class="skeleton-table__td"><div class="skeleton-box w-3/4"></div></td>
                             <td class="skeleton-table__td"><div class="skeleton-box w-1/2"></div></td>
                             <td class="skeleton-table__td"><div class="skeleton-box w-8 mx-auto"></div></td>
                           </tr>
                           <tr class="skeleton-table__row">
                             <td class="skeleton-table__td"><div class="skeleton-box w-6 mx-auto"></div></td>
                             <td class="skeleton-table__td"><div class="skeleton-box w-2/3"></div></td>
                             <td class="skeleton-table__td"><div class="skeleton-box w-5/6"></div></td>
                             <td class="skeleton-table__td"><div class="skeleton-box w-8 mx-auto"></div></td>
                           </tr>
                           <tr class="skeleton-table__row">
                             <td class="skeleton-table__td"><div class="skeleton-box w-6 mx-auto"></div></td>
                             <td class="skeleton-table__td"><div class="skeleton-box w-4/5"></div></td>
                             <td class="skeleton-table__td"><div class="skeleton-box w-2/3"></div></td>
                             <td class="skeleton-table__td"><div class="skeleton-box w-8 mx-auto"></div></td>
                           </tr>
                         </tbody>
                       </table>
                     </div>
                   </div>
                 </div>
               </div>

               <!-- Actual Content Layer -->
               @if (entity) {
                 <div class="col-start-1 row-start-1 z-10 animate-fade-in">
                   <app-entity-card [entity]="entity" />
                 </div>
               }
            </div>
          }
        </div>
      </div>
    </div>

    @if (!entityFromPrompt$) {
       <div class="results__empty-state">
          <p class="results__empty-state-text">Ask a question to look for results.</p>
       </div>
    }

  </div>
</div>
