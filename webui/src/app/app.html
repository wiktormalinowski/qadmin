<div class="min-h-screen bg-slate-950 text-slate-100 font-sans flex flex-col items-center py-10 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
  
  <div class="absolute top-0 left-1/4 w-96 h-96 bg-blue-600/10 rounded-full mix-blend-screen filter blur-3xl animate-blob"></div>
  <div class="absolute top-0 right-1/4 w-96 h-96 bg-sky-500/10 rounded-full mix-blend-screen filter blur-3xl animate-blob animation-delay-2000"></div>

  <div class="w-full max-w-5xl bg-white/5 backdrop-blur-2xl rounded-3xl border border-white/10 p-8 sm:p-12 relative z-10">
    
    <header class="mb-12 text-center">
      <h1 class="text-4xl font-extrabold tracking-tight sm:text-6xl text-transparent bg-clip-text bg-gradient-to-r from-blue-300 via-sky-200 to-white drop-shadow-sm pb-2">QAdmin AI</h1>
      <p class="mt-4 max-w-2xl mx-auto text-xl text-blue-200/60 font-light">Fluid insights. Subtle transitions.</p>
    </header>

    <div class="mb-8 relative group">
      <div class="absolute -inset-0.5 bg-gradient-to-r from-blue-600/20 to-cyan-500/20 rounded-full blur opacity-0 group-hover:opacity-100 transition duration-500"></div>
      <div class="relative flex items-center bg-slate-900/50 backdrop-blur-md rounded-full border border-white/10 p-1.5 focus-within:ring-1 focus-within:ring-blue-500/50 focus-within:bg-slate-900/70 transition-all duration-300">
        <input 
          #promptInput 
          type="text" 
          placeholder="Ask AI for data (e.g., 'show all owners')..." 
          class="flex-1 bg-transparent py-4 px-6 text-white placeholder-blue-200/40 focus:outline-none w-full text-lg font-medium"
          (keydown.enter)="entityFromPrompt$ = service.getEntityFromPrompt(promptInput.value)"
        />
        <button 
          (click)="entityFromPrompt$ = service.getEntityFromPrompt(promptInput.value)"
          class="ml-2 bg-slate-800 hover:bg-slate-700 text-blue-200 hover:text-white font-medium py-3 px-8 rounded-full transition-colors duration-300 flex-shrink-0 border border-white/5 hover:border-blue-500/30"
        >
          Generate
        </button>
      </div>
    </div>

    <!-- Expanding container -->
    <div class="grid transition-all duration-700 ease-in-out" 
         [class.grid-rows-[1fr]]="entityFromPrompt$" 
         [class.grid-rows-[0fr]]="!entityFromPrompt$">
      <div class="overflow-hidden">
        <div class="pt-4 pb-2 transition-all duration-700 ease-out">
          @if (entityFromPrompt$; as entityObs) {
            @if (entityObs | async; as entity) {
               <div class="animate-in fade-in duration-700 delay-150">
                 <app-entity-card [entity]="entity" />
               </div>
            } @else {
               <div class="flex items-center justify-center py-16 animate-in fade-in duration-300">
                 <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-blue-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                 </svg>
                 <span class="text-blue-200/70 font-medium tracking-wide">Thinking...</span>
               </div>
            }
          }
        </div>
      </div>
    </div>

    @if (!entityFromPrompt$) {
       <div class="text-center py-16 px-4">
          <p class="text-blue-200/30 text-sm">Type a prompt to wake the AI.</p>
       </div>
    }

  </div>
</div>
