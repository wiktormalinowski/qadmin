<div class="app">
  
  <div class="app__blob app__blob--blue"></div>
  <div class="app__blob app__blob--sky"></div>

  <div class="app__main-card">
    
    <header class="app__header">
      <h1 class="app__title">QAdmin AI</h1>
      <p class="app__subtitle">Fluid insights. Subtle transitions.</p>
    </header>

    <div class="search-bar group">
      <div class="search-bar__glow"></div>
      <div class="search-bar__box">
        <input 
          #promptInput 
          type="text" 
          placeholder="Ask AI for data (e.g., 'show all owners')..." 
          class="search-bar__input"
          (keydown.enter)="entityFromPrompt$ = service.getEntityFromPrompt(promptInput.value)"
        />
        <button 
          (click)="entityFromPrompt$ = service.getEntityFromPrompt(promptInput.value)"
          class="search-bar__button"
        >
          Generate
        </button>
      </div>
    </div>

    <!-- Expanding container -->
    <div class="results" 
         [class.results--expanded]="entityFromPrompt$" 
         [class.results--collapsed]="!entityFromPrompt$">
      <div class="overflow-hidden">
        <div class="results__wrapper">
          @if (entityFromPrompt$; as entityObs) {
            @if (entityObs | async; as entity) {
               <div class="results__fade-in">
                 <app-entity-card [entity]="entity" />
               </div>
            } @else {
               <div class="results__loading">
                 <svg class="results__spinner" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                 </svg>
                 <span class="results__loading-text">Thinking...</span>
               </div>
            }
          }
        </div>
      </div>
    </div>

    @if (!entityFromPrompt$) {
       <div class="results__empty-state">
          <p class="results__empty-state-text">Type a prompt to wake the AI.</p>
       </div>
    }

  </div>
</div>
