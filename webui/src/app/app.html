<div class="min-h-screen bg-slate-50 text-slate-900 font-sans flex flex-col items-center py-10 px-4 sm:px-6 lg:px-8 transition-colors duration-300">
  <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100 p-8 hover:shadow-2xl transition-shadow duration-300">
    
    <header class="mb-10 text-center">
      <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 sm:text-5xl bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600 pb-2">Data Dashboard</h1>
      <p class="mt-3 max-w-2xl mx-auto text-xl text-slate-500 sm:mt-4">Explore and manage your system entities.</p>
    </header>

    <div class="mb-10 group relative">
      <div class="flex items-center bg-slate-50 rounded-full border border-slate-200 p-1 shadow-sm focus-within:ring-2 focus-within:ring-indigo-500 focus-within:border-indigo-500 transition-all duration-200">
        <input 
          #promptInput 
          type="text" 
          placeholder="Enter prompt (e.g., 'show users')..." 
          class="flex-1 bg-transparent py-3 px-5 text-slate-900 placeholder-slate-400 focus:outline-none w-full"
          (keydown.enter)="entityFromPrompt$ = service.getEntityFromPrompt(promptInput.value)"
        />
        <button 
          (click)="entityFromPrompt$ = service.getEntityFromPrompt(promptInput.value)"
          class="ml-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded-full transition-colors duration-200 flex-shrink-0 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
        >
          Get Entity
        </button>
      </div>
    </div>

    <div class="mt-8 transition-all duration-500 ease-in-out">
      @if (entityFromPrompt$; as entityObs) {
        @if (entityObs | async; as entity) {
           <div class="animate-in fade-in slide-in-from-bottom-4 duration-500">
             <app-entity-card [entity]="entity" />
           </div>
        } @else {
           <div class="flex justify-center items-center py-12">
             <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
             <span class="ml-3 text-slate-500 font-medium">Loading...</span>
           </div>
        }
      } @else {
         <div class="text-center py-16 px-4 bg-slate-50 rounded-xl border border-dashed border-slate-300">
            <svg class="mx-auto h-12 w-12 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
            </svg>
            <h3 class="mt-2 text-sm font-semibold text-slate-900">No entity selected</h3>
            <p class="mt-1 text-sm text-slate-500">Enter a prompt above to fetch an entity.</p>
          </div>
      }
    </div>

  </div>
</div>
