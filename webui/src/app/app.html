<div class="container">
  <h1>Data Dashboard</h1>

  @if (vm$ | async; as entities) {
    @for (entity of entities; track entity.name) {
      <app-entity-card [entity]="entity" />
    } @empty {
      <div class="empty-dashboard">No entities found.</div>
    }
  } @else {
    <div class="loading">Loading system data...</div>
  }
</div>
